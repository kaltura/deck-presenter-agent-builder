name: CI

# Plain pull_request only. It checks out untrusted fork code, so it must never
# be pull_request_target or workflow_run, and it is given no secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Leak and path guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # No local blocked-strings list here, so this runs the structural rules
      # only: account ids, secrets, session keys, developer paths, real emails.
      - name: Scan for credentials and account ids
        run: node bin/scan-leaks.mjs

      - name: Block committed content, credentials, and porting source
        run: |
          # Real deck content is allowed only under fixtures/, demo/, and
          # test/fixtures/ (synthetic test data), which are fictional by
          # rule. data/slides anywhere else is a leak.
          bad=$(git ls-files \
            | grep -vE '^(fixtures|demo|test/fixtures)/' \
            | grep -vE '^\.env\.example$' \
            | grep -vE '(^|/)\.gitkeep$' \
            | grep -E \
              -e '^port/' \
              -e '^\.env($|\.)' \
              -e '\.(pdf|pptx|ppt|key)$' \
              -e '(^|/)data/(slides|kb)/' \
              -e '\.local\.(md|txt)$' \
              -e '(provisioning-state|deploy-result)\.json$' \
            || true)
          if [ -n "$bad" ]; then
            echo "These paths must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No blocked paths tracked."

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - run: npm ci

      - run: npm test

  lint-prompts:
    name: Semantic prompt lint (golden output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Needs no live account: checks demo/'s and fixtures/smoke-project's
      # already-generated ingestion and prompt-drafting output against
      # ARCHITECTURE.md 6.4's semantic lint (slide references, chapter ranges, KB
      # frontmatter, the fixed identity-and-disclosure skeleton).
      - run: npm run lint-prompts

      # Also needs no live account: a chunk-level retrieval eval over
      # demo/'s KB files against a synthetic Q&A set, so a retrieval miss
      # (wrong chunk found) is caught separately from a generation miss
      # (the live agent's own LLM step, out of scope for this check).
      - run: npm run eval-retrieval
