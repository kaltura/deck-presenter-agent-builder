name: Live E2E

# Runs real, billable Kaltura calls against the demo project's live account,
# so it needs real secrets and a human in the loop. workflow_dispatch only,
# restricted to users with write access: never on push, never on pull_request
# (a fork PR would get no secrets anyway, but a same-repo PR would, and this
# suite must not run unattended). Plain push/pull_request gets the secretless
# checks in ci.yml instead.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Browser E2E against the live demo widget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox

      # demo/.provisioning-state.json is gitignored (it holds live resource
      # ids), so it comes from a secret. This way the suite tests the same
      # agent the maintainers update and eval. A maintainer refreshes the
      # secret after any command that changes the state file:
      #   gh secret set DEMO_PROVISIONING_STATE < demo/.provisioning-state.json
      - name: Write demo provisioning state
        run: |
          if [ -z "$STATE" ]; then
            echo "::error::Set the DEMO_PROVISIONING_STATE secret to the demo project's .provisioning-state.json."
            exit 3
          fi
          printf '%s' "$STATE" > demo/.provisioning-state.json
          node -e "const s = JSON.parse(require('fs').readFileSync('demo/.provisioning-state.json', 'utf8')); if (!s.steps?.widgetId?.value) { console.error('::error::DEMO_PROVISIONING_STATE has no widgetId. Provision the demo project first.'); process.exit(3); }"
        env:
          STATE: ${{ secrets.DEMO_PROVISIONING_STATE }}

      # dist.html is gitignored, so CI must rebuild it before serving it.
      - name: Bundle the demo client
        run: node engine/bundle.mjs --project demo
        env:
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_ADMIN_SECRET: ${{ secrets.KALTURA_ADMIN_SECRET }}

      # On failure, each test prints its masked debug timeline to this log
      # (test/e2e/helpers.mjs). No trace artifact is uploaded: traces hold the
      # session token and live ids.
      - name: Run the browser E2E suite
        run: npm run test:e2e
