name: Live E2E

# Never on pull_request or push: this job runs real, billable Kaltura calls
# against the demo project's live account and needs real secrets, which a
# fork PR must never see. Trigger manually from the Actions tab.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Browser E2E against the live demo widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Idempotent: makes no live call if demo's provisioning state already
      # matches project.json. Needed so a first-ever run on a clean checkout
      # can still provision the demo project from nothing.
      - name: Provision the demo project
        run: node engine/provision.mjs --project demo --yes --json
        env:
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_ADMIN_SECRET: ${{ secrets.KALTURA_ADMIN_SECRET }}

      # dist.html is gitignored, so CI must rebuild it before serving it.
      - name: Bundle the demo client
        run: node engine/bundle.mjs --project demo
        env:
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_ADMIN_SECRET: ${{ secrets.KALTURA_ADMIN_SECRET }}

      - name: Run the browser E2E suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
