name: Live E2E

# Runs real, billable Kaltura calls against the demo project's live account,
# so it needs real secrets and a human in the loop. workflow_dispatch only,
# restricted to users with write access: never on push, never on pull_request
# (a fork PR would get no secrets anyway, but a same-repo PR would, and this
# suite must not run unattended). Plain push/pull_request gets the secretless
# checks in ci.yml instead.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Browser E2E against the live demo widget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox

      # The bundle needs only the maintained demo's widget id, and it changes
      # only when the demo is re-provisioned. It comes from the DEMO_WIDGET_ID
      # secret (a secret, not a variable, so the runner masks it in every log
      # line), and this step fails fast if the widget no longer opens
      # a session, so a stale id never looks like a client bug. It makes the
      # same two read-only calls the browser makes (startWidgetSession, then
      # appInit). To set or refresh the secret from the local state file:
      #   gh secret set DEMO_WIDGET_ID --body "$(node -p "require('./demo/.provisioning-state.json').steps.widgetId.value")"
      - name: Check the demo widget id is live
        run: |
          if [ -z "$DEMO_WIDGET_ID" ]; then
            echo "::error::Set the DEMO_WIDGET_ID secret to the demo project's widget id."
            exit 3
          fi
          node --input-type=module -e "
            import { Management } from '@kaltura/intelligent-agents/management';
            const k = new Management({ partnerId: Number(process.env.KALTURA_PARTNER_ID) });
            try {
              const token = await k.sessions.createWidgetToken({ widgetId: process.env.DEMO_WIDGET_ID });
              await k.application.appInit(token.ks);
            } catch (err) {
              console.error('::error::DEMO_WIDGET_ID does not open a session (' + (err.code || err.message) + '). The demo was probably re-provisioned. Refresh the secret from demo/.provisioning-state.json.');
              process.exit(3);
            }
          "
        env:
          DEMO_WIDGET_ID: ${{ secrets.DEMO_WIDGET_ID }}
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}

      # dist.html is gitignored, so CI must rebuild it before serving it.
      - name: Bundle the demo client
        run: node engine/bundle.mjs --project demo --widget-id="$DEMO_WIDGET_ID"
        env:
          DEMO_WIDGET_ID: ${{ secrets.DEMO_WIDGET_ID }}
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_ADMIN_SECRET: ${{ secrets.KALTURA_ADMIN_SECRET }}

      # On failure, each test prints its masked debug timeline to this log
      # (test/e2e/helpers.mjs). No trace artifact is uploaded: traces hold the
      # session token and live ids.
      - name: Run the browser E2E suite
        run: npm run test:e2e
